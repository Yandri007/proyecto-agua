name: Multiplatform Flutter Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # Job 1: Build Android APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      # Decodificar el Keystore desde GitHub Secrets para una firma segura
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        continue-on-error: true # Permite compilar builds de desarrollo sin secretos

      # Generar key.properties dinámicamente usando secretos o credenciales por defecto
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD || 'aquacontrolpass' }}" > frontend/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'aquacontrolpass' }}" >> frontend/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'key' }}" >> frontend/android/key.properties
          echo "storeFile=../key.jks" >> frontend/android/key.properties
        continue-on-error: true

      - name: Build APK
        run: |
          cd frontend
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  # Job 2: Build Linux Desktop
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Linux
        run: |
          cd frontend
          flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: frontend/build/linux/x64/release/bundle/

  # Job 3: Build Windows Desktop
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Windows
        run: |
          cd frontend
          flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: frontend/build/windows/x64/release/runner/
